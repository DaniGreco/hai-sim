# Builds data/cache/vindr__medgemma-1.5-4b: MedGemma 1.5 4B on the 15,000 VinDr-CXR
# training images (the 1024 px PNG release; see configs/cache/vindr_ensemble.yaml).
#
# The model answers one yes/no question per finding and the cache keeps P(yes), read from
# the token log-probabilities. Serve it with vLLM (v0.23.0; the weights are gated on
# Hugging Face, accept the licence first), then build:
#
#   vllm serve google/medgemma-1.5-4b-it --served-model-name medgemma-4b --max-model-len 8192
#   uv run python scripts/materialize_cache.py --scenario configs/cache/vindr_medgemma_4b.yaml \
#       --limit 300 --mode fill            # a pilot first, then --limit 0 for all 15,000
#
# The shipped cells were built with the 4B in BF16. MedGemma 27B is a first-generation
# model and the 4B a 1.5 one: the two differ in size and in generation.
name: vindr_medgemma_4b
seed: 42
label_schema: xrv

patient_generator:
  kind: image_folder
  dataset_id: vindr                 # cache stem -> data/cache/vindr__medgemma-1.5-4b
  imgpath: data/vindr/images        # the 1024 px VinDr-CXR train PNGs (15,000)
  image_ext: .png
  arrival_rate: 0.5
  n_patients: 200
  resize: 896                       # MedGemma encodes at 896x896 into 256 SigLIP tokens
  gt_source: native
  label_sources:
    - name: majority                # >= 2 of 3 radiologists (built with --k 2)
      kind: csv
      path: data/vindr/labels.csv
      id_column: image_id
      space: vindr
      map: vindr14->xrv

label_view:
  mode: subset
  targets:
    - Cardiomegaly
    - Effusion
    - Consolidation
    - Atelectasis
    - Infiltration
    - Nodule
    - Mass
    - Pleural_Thickening
    - Pneumothorax
    - Fibrosis
    - Lung Opacity

ai:
  kind: medgemma
  backend: vllm
  model_id: google/medgemma-1.5-4b-it     # identity + cache alias (-> medgemma-1.5-4b)
  served_model_name: medgemma-4b          # the server's --served-model-name
  endpoint: http://localhost:8000/v1
  readout: independent_question           # one yes/no question per label; P(yes) from logprobs
  prompt_set: single
  uq: entropy
  decision_threshold: 0.5                 # post-hoc; the cache stores raw probabilities
  concurrency: 6                          # in-flight questions; <= the server's --max-num-seqs
  top_logprobs: 20
  service_time: 30.0
  cache_mode: require                     # studies replay; the build uses --mode fill

persona: senior_skeptical

sort:
  kind: uncertainty_desc
  aggregator: mean
