# Builds data/cache/vindr__medgemma-27b: MedGemma 27B on the 15,000 VinDr-CXR training
# images (the 1024 px PNG release; see configs/cache/vindr_ensemble.yaml).
#
# The model answers one yes/no question per finding and the cache keeps P(yes), read from
# the token log-probabilities. Serve it with vLLM (v0.23.0; the weights are gated on
# Hugging Face, accept the licence first), then build:
#
#   vllm serve google/medgemma-27b-it --served-model-name medgemma-27b \
#       --quantization fp8 --kv-cache-dtype fp8 --max-model-len 16384 --max-num-seqs 8
#   uv run python scripts/materialize_cache.py --scenario configs/cache/vindr_medgemma_27b.yaml \
#       --limit 0 --mode fill --checkpoint-every 200
#
# The shipped cells were built with the 27B in FP8 and the 4B in BF16. The cache does not
# record the precision, so do not mix an FP8 and a BF16 build in one cell.
name: vindr_medgemma_27b
seed: 42
label_schema: xrv

patient_generator:
  kind: image_folder
  dataset_id: vindr
  imgpath: data/vindr/images
  image_ext: .png
  arrival_rate: 0.5
  n_patients: 200
  resize: 896                       # MedGemma's input size
  gt_source: native
  label_sources:
    - name: majority                # >= 2 of 3 radiologists (built with --k 2)
      kind: csv
      path: data/vindr/labels.csv
      id_column: image_id
      space: vindr
      map: vindr14->xrv

label_view:
  mode: subset
  targets:
    - Cardiomegaly
    - Effusion
    - Consolidation
    - Atelectasis
    - Infiltration
    - Nodule
    - Mass
    - Pleural_Thickening
    - Pneumothorax
    - Fibrosis
    - Lung Opacity

ai:
  kind: medgemma
  backend: vllm
  model_id: google/medgemma-27b-it        # identity + cache alias (-> medgemma-27b)
  served_model_name: medgemma-27b         # the server's --served-model-name
  endpoint: http://localhost:8000/v1
  readout: independent_question           # one yes/no question per label; P(yes) from logprobs
  prompt_set: single
  uq: entropy
  decision_threshold: 0.5
  concurrency: 6                          # in-flight questions; <= the server's --max-num-seqs
  top_logprobs: 20
  service_time: 30.0
  cache_mode: require

persona: senior_skeptical

sort:
  kind: uncertainty_desc
  aggregator: mean
