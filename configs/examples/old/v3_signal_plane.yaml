# All four new seams at once, on the real NIH inference cache.
#
# This scenario exists to be *read*, not just run: it is the shortest statement of what
# the framework can now vary. Every block below was a hardcoded constant before.
#
#   arrivals    — WHEN patients come, separated from WHICH patient comes
#   calibration — whether the AI's probabilities can be believed
#   difficulty  — how hard each case is, and therefore whether the doctor's errors
#                 land on the same images as the AI's
#   fatigue     — how worn the reader is, and what that costs in accuracy and in time
#
# Run it:
#   python -m hai_sim.cli run --scenario configs/examples/v3_signal_plane.yaml
#
# Then look at the `sig.difficulty` and `sig.fatigue` columns in the records CSV: those
# two did not exist before, and they are what every conditioned metric can now slice on.
name: v3_signal_plane
seed: 42
label_schema: xrv

patient_generator:
  kind: inference_cache
  cache_stem: data/cache/nih_ensemble
  n_patients: 400
  # `arrival_rate` stays the baseline rate and is what a homogeneous process uses.
  # With `arrivals` present it becomes the fallback, and the process below takes over.
  arrival_rate: 0.5
  arrivals:
    # A non-homogeneous Poisson process by thinning (Lewis & Shedler 1979). Twelve
    # slots over a period of 12 time units: a quiet stretch, a morning peak, a lull,
    # an evening peak. Real work would use 168 hourly rates stratified by day of week
    # (TESI.md §4.9 calls that stratification necessary, not optional) — this is small
    # enough to read.
    #
    # ⚠️ This is where a triage study lives or dies. Reordering a queue can only change
    # outcomes when patients are *waiting*, so an order effect exists only under
    # saturation. Getting arrivals wrong does not add noise to a triage result, it
    # removes the phenomenon.
    kind: nhpp
    rates: [0.1, 0.1, 0.4, 1.2, 1.5, 0.9, 0.4, 0.3, 0.8, 1.3, 0.6, 0.2]
    period: 12.0

ai:
  kind: cached
  cache_stem: data/cache/nih_ensemble
  uq: ensemble
  ensemble_measure: mutual_information
  decision_threshold: 0.5
  service_time: 0.05
  calibration:
    # Fitted, not guessed: `python scripts/fit_calibration.py --cache
    # data/cache/nih_ensemble` reports ECE 0.269 -> 0.221 on held-out images at this
    # temperature. Below 1 means the ensemble is *under*-confident in aggregate, which
    # is the opposite of the usual assumption and worth stating.
    #
    # ⚠️ Fitted on this cache. Reporting a study on the same images that fitted the
    # calibrator is circular — split them, or fit on a cache you do not score.
    kind: temperature
    temperature: 0.5651

# The latent difficulty of TESI.md §8.1, taken from the model's own epistemic
# uncertainty. That choice is what makes the human-AI error coupling *induced from real
# model behaviour* rather than imposed by a parameter — the escape route §10 names for
# the arbitrary Beta(2,5) prior.
#
# Swap `kind: prior` for the rho = 0 control (a Beta draw ignores the image entirely),
# or `kind: table` with a CSV from scripts/build_difficulty_table.py to drive difficulty
# from inter-reader disagreement, or from any future learned complexity model.
difficulty:
  kind: uncertainty
  source: mutual_information
  aggregator: mean

# No analytic fatigue curve exists for radiology (TESI.md §10, hole 1) — only isolated
# pre/post points — so the shape is a configuration line and a sensitivity analysis over
# it is mandatory. `composite` runs two clocks at once, which is what a night shift is:
# a vigilance decrement that accumulates with cases read, and a circadian rhythm that
# does not care what you have done.
#
# ⚠️ Time has no units. These parameters assume one simulation time unit = one hour.
fatigue:
  kind: composite
  parts: [vigilance, circadian]
  combine: max
  # vigilance: most of the decrement has arrived by ~60 studies
  asymptote: 0.6
  scale: 60.0
  basis: cases
  # circadian: peak fatigue at 05:00 on a 24-unit day
  amplitude: 0.25
  mean: 0.25
  period: 24.0
  acrophase: 5.0

persona:
  name: senior_coupled
  capability:
    kind: fixed_accuracy
    sensitivity: 0.95
    specificity: 0.95
    # THE line that makes rho a parameter. At 0.0 this reader flips labels from a coin
    # that never saw the image, so its errors are independent of the AI's by
    # construction and no scenario can make them otherwise — the defect behind the
    # measured "the AI never flips a senior's call" result (§8.1). At 0.4 a maximally
    # hard case costs 0.4 of both sensitivity and specificity.
    difficulty_slope: 0.4
    fatigue_slope: 0.1
    floor: 0.5
    service_time:
      kind: lognormal
      mu: 0.5
      sigma: 0.4
      # A worn reader takes up to 40% longer. This is the time dimension §6.7 records
      # as missing from the doctor model — and note it feeds back: slower reads deepen
      # the queue, which raises the load, which is itself the experimental condition.
      fatigue_slope: 0.4
      # The sign of the AI's effect on reading time is unresolved (§9): Seah 2021
      # measured 81s -> 56s, the verification-cost argument predicts the opposite.
      # Sweep this rather than picking one.
      factor: 1.0
  sees_ai: true
  trust:
    kind: linear_pool
    weight_ai: 0.39

sort:
  kind: uncertainty_desc
  aggregator: mean

# What the signal plane buys the metrics: every bundle, computed per difficulty band and
# per load regime. "Does triage help?" is not one number — it is a different number on
# hard cases under saturation than on easy ones in a quiet hour, and that contrast was
# not expressible before.
kpi_groups:
  - key: sig.difficulty
    edges: [0.15, 0.35]
  - key: load.in_system_at_arrival
    edges: [5]

n_ai_workers: 1
n_doctor_workers: 2
