# Framework showcase — the swappable pieces together on a synthetic dataset.
# Runs with no heavy deps (mock AI + mock_dataset). Demonstrates: the capability-aware
# Dataset path, a projected label view, an inline persona with a confidence-gated trust
# policy, a per-patient severity model, and an explicit KPI-bundle selection.

name: v2_framework_showcase
seed: 11
label_schema: default_v0

label_view:                     # study just two labels (single-/few-label study)
  mode: subset
  targets: [L2, L4]             # active schema becomes (L2, L4)

patient_generator:
  kind: mock_dataset            # synthetic images through the Dataset contract (no torch)
  arrival_rate: 0.5
  n_patients: 40
  n_examples: 60
  prevalence: 0.3
  gt_source: native             # capability-gated: the dataset only provides 'native'

ai:
  kind: random_mock

persona:                        # inline: a junior reader that trusts the AI only when it is confident
  capability:
    kind: fixed_accuracy
    sensitivity: 0.85
    specificity: 0.88
  sees_ai: true
  trust:
    kind: confidence_gated      # heed the AI only where its confidence >= threshold
    weight_ai: 0.5
    confidence_threshold: 0.7

sort:
  kind: uncertainty_desc
  aggregator: mean

severity:                       # oracle severity from ground truth, per-label criticality
  kind: activation
  source: gt
  criticality: [3.0, 2.0]       # length = active schema (L2, L4)
  aggregator: max

kpis: [system, actors, team, joint_table]

n_ai_workers: 1
n_doctor_workers: 1
