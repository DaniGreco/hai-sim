# Study example — the RQ3 persona sweep on a synthetic dataset (fast, no torch).
# Runs the 5 personas x 2 triage aggregators x 3 replication seeds = 30 runs, and tabulates
# the team-level KPIs into one tidy table:  hai-sim study configs/examples/study_persona_grid.yaml

name: persona_grid
base:                           # inline base scenario (could also be a path to a scenario YAML)
  name: base
  seed: 0
  label_schema: default_v0
  patient_generator:
    kind: mock_dataset
    arrival_rate: 0.5
    n_patients: 50
    n_examples: 80
    prevalence: 0.3
  ai:
    kind: random_mock
  persona: solo_senior
  sort:
    kind: uncertainty_desc
    aggregator: mean

factors:                        # dotted config-paths → levels
  persona: [solo_senior, senior_trusting, senior_skeptical, junior_trusting, junior_skeptical]
  sort.aggregator: [mean, max]

design: grid                    # full cross-product (use "ofat" for one-factor-at-a-time)
replications: [1, 2, 3]         # seeds — common random numbers give each arm the same stream

report:                         # KPI-paths to tabulate (one column each)
  - team.complementarity_gap_f1
  - team.rair
  - actors.hybrid.recall_macro
  - actors.hybrid.n_fn
  - joint_table.n_entries
