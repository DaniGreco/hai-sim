# Conditioned KPIs — every selected bundle computed once per subgroup.
#
#   hai-sim run configs/examples/v2_conditioned_kpis.yaml
#
# `kpi_groups` is the answer to three questions the framework could not previously be
# asked, because every bundle folded the whole run into a single number:
#
#   - is recall worse on the severe cases?          → group by `severity`
#   - does the department degrade under load?       → group by `load.in_system_at_arrival`
#   - which pathology carries the errors?           → group by `label`
#
# Each entry either bins a continuous quantity (`edges: [1, 5]` → `<1`, `1-5`, `>=5`) or
# splits on a raw value. Several entries cross, so `severity x label` gives one subgroup
# per (band, pathology). The console prints a preview; the full grid lands in the JSON
# under `kpis_by_group`.
#
# Any key readable off a record works: a field (`severity`, `priority_key`, `ts_arrival`)
# or an observation from the telemetry (`ctx.sex`, `ctx.age`, `load.*`, `ai.*`, `doc.*`).
# See the `observations` section of hai_sim/README.md for what a run publishes.
name: v2_conditioned_kpis
seed: 11
label_schema: default_v0

patient_generator:
  kind: mock_dataset
  arrival_rate: 2.0             # above the doctor's service rate, so congestion builds
  n_patients: 120
  n_examples: 200
  prevalence: 0.3

ai:
  kind: random_mock

persona: junior_trusting

sort:
  kind: uncertainty_desc
  aggregator: mean

severity:                       # oracle severity, so the severity bands are meaningful
  kind: activation
  source: gt
  criticality: [3.0, 1.0, 2.0, 1.0, 3.0]
  aggregator: max

kpis: [system, actors]

kpi_groups:
  - key: severity
    edges: [1.0, 2.5]           # mild / moderate / severe
  - key: load.in_system_at_arrival
    edges: [5.0, 20.0]          # quiet / busy / saturated at the moment of arrival
