# "The AI performs well — is it trusted, and does that vary with capability?" (§3, RQ3)
#
#   hai-sim study configs/examples/study_sdt_trust_sweep.yaml
#
# A fully synthetic, fully controlled study. Both readers are signal-detection observers
# (hai_sim.sdt): capability is a dial (`d_prime`), so "a good AI" and "a weak doctor" are
# set, not hoped for. The doctor's belief varies case by case, which is what makes the
# integration policy a smooth reliance CURVE across the trust axis rather than the step a
# fixed-accuracy reader produces (../TESI.md §8.1).
#
# Three crossed axes:
#   ai.d_prime                 how good the AI is        2.56 / 3.29 / 4.00  ≈ acc 0.90 / 0.95 / 0.98
#   persona.capability.d_prime how good the doctor is    1.68 / 2.56 / 3.29  ≈ junior / mid / senior
#   persona.trust.weight_ai    how much it leans on the AI  0 … 1
#
# `baseline: weight_ai = 0` makes every trust level a PAIRED contrast against the same
# doctor ignoring the AI (same seed → same patient stream → the difference is the trust
# effect with sampling noise cancelled, not averaged). The single label keeps the question
# clean: did the doctor heed the AI on *this* call?
name: sdt_trust_sweep

base:
  name: base
  seed: 0
  label_schema: single
  patient_generator:
    kind: poisson
    arrival_rate: 0.5
    n_patients: 2000
    prevalence: 0.3
    embed_truth: true          # the synthetic AI reads the case from the "image"
  ai:
    kind: fixed_accuracy
    d_prime: 3.29              # overwritten by the ai.d_prime factor
    prior: 0.3                 # calibrated to the base rate
  persona:
    name: sdt_doctor
    capability:
      kind: sdt
      d_prime: 2.56            # overwritten by the persona.capability.d_prime factor
      prior: 0.3
    sees_ai: true
    trust:
      kind: linear_pool
      weight_ai: 0.4           # overwritten by the persona.trust.weight_ai factor
  sort:
    kind: uncertainty_desc
    aggregator: mean

factors:
  ai.d_prime: [2.56, 3.29, 4.00]
  persona.capability.d_prime: [1.68, 2.56, 3.29]
  persona.trust.weight_ai: [0.0, 0.25, 0.5, 0.75, 1.0]

design: grid
replications: [1, 2, 3, 4, 5]

baseline:
  persona.trust.weight_ai: 0.0   # every trust level is contrasted against ignoring the AI

kpis: [system, actors, team]

report:
  - actors.ai.recall_macro
  - actors.ai.f1_macro
  - actors.doctor.recall_macro
  - actors.hybrid.recall_macro
  - actors.hybrid.f1_macro
  - actors.hybrid.n_fn
  - team.complementarity_gap_f1
  - team.rair
  - team.rsr
  - team.over_reliance
  - team.under_reliance
