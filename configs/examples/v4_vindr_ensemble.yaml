# VinDr-CXR as the patient stream — a second, out-of-domain dataset next to NIH.
#
# Images: the 1024px VinDr train set (15,000 PA CXR). Labels: three radiologists per
# image, reduced offline by scripts/build_vindr_labels.py to a k-of-3 presence table in
# VinDr's own 14-finding vocabulary, then mapped INTO the model's xrv schema *here* (a
# config line via `map: vindr14->xrv`, not baked into the CSV). Difficulty is the real
# inter-reader disagreement on the same images, so rho_HM is measured on-sample rather
# than transferred (../TESI.md §8.1).
#
# The DenseNet ensemble has no VinDr-trained member, so this run is deliberately
# OUT-OF-DOMAIN: NIH (in-domain) vs VinDr (OOD) is a study axis, not a confound.
#
# Live inference over 15,000 images is a server job. Run a handful here to smoke it, then
# build an InferenceCache and point `ai.kind: cached` at it, exactly as the NIH ensemble
# studies do.
name: v4_vindr_ensemble
seed: 42
label_schema: xrv

patient_generator:
  kind: image_folder
  imgpath: data/vindr/images        # junction -> the 1024px VinDr train PNGs
  image_ext: .png
  arrival_rate: 0.5
  n_patients: 200
  resize: 224                        # the DenseNet's native input resolution
  # Which annotations to believe. 'native' = the first label_source below. Attach more
  # sources (e.g. a k>=3 unanimous table) and swap gt_source for a ground-truth-robustness
  # paired contrast — same seed, different believed truth.
  gt_source: native
  label_sources:
    - name: majority                 # >= 2 of 3 radiologists (built with --k 2)
      kind: csv
      path: data/vindr/labels.csv
      id_column: image_id            # VinDr's native id column (= the PNG stem)
      space: vindr                   # the CSV columns are VinDr's 14 findings
      map: vindr14->xrv              # rename / split into the 18-pathology xrv schema

# Score only the findings VinDr and the model share — the clean cross-dataset set.
label_view:
  mode: subset
  targets:
    - Cardiomegaly
    - Effusion
    - Consolidation
    - Atelectasis
    - Infiltration
    - Nodule
    - Mass
    - Pleural_Thickening
    - Pneumothorax
    - Fibrosis
    - Lung Opacity

ai:
  kind: torchxrv
  weights:                           # the 5-member cross-domain Deep Ensemble
    - densenet121-res224-nih
    - densenet121-res224-chex
    - densenet121-res224-mimic_ch
    - densenet121-res224-pc
    - densenet121-res224-rsna
  uq: ensemble
  ensemble_measure: mutual_information
  decision_threshold: 0.5
  device: cpu

# Real inter-reader disagreement on the SAME images -> the coupling is measured on-sample.
difficulty:
  kind: table
  path: data/vindr/difficulty.csv
  value_column: mean_delta_active

persona: senior_skeptical

sort:
  kind: uncertainty_desc
  aggregator: mean
