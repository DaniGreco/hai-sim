# RQ3: does uncertainty triage buy time for the severe cases — and under what load?
#
#   hai-sim study configs/examples/study_order_load.yaml
#
# Methodological ground rule (thesis §5.6): the MEAN wait is permutation-invariant —
# reordering the queue cannot change it, it only changes WHO waits. Ordering effects
# therefore exist only under saturation and only in severity-conditioned metrics. Hence:
#   - load is an explicit factor: arrival_rate sweeps below / at / above the single
#     reader's service rate (lognormal mu 2.5, sigma 0.4 → mean read ~ 13.2 time units
#     → saturation near arrival_rate ~ 0.075);
#   - `by: severity` conditions every time metric on a ground-truth severity built
#     from a declared 18-label criticality vector (3-tier urgency taxonomy: acute
#     findings like Pneumothorax/Edema high, chronic ones like Hernia low — a modeling
#     choice, stated as such);
#   - the sort factor contrasts uncertainty-descending triage against random order,
#     paired seed by seed.
name: order_load

base:
  name: base
  seed: 0
  label_schema: xrv
  patient_generator:
    kind: inference_cache
    cache_stem: data/cache/composed/vindr__ens4
    arrival_rate: 0.075
    n_patients: 1000
    sample_mode: random
  ai:
    kind: cached
    cache_stem: data/cache/composed/vindr__ens4
    uq: ensemble
    ensemble_measure: mean_entropy
    decision_threshold: 0.5
    service_time: 0.25
  severity:
    kind: activation
    source: gt
    aggregator: max
    # xrv label order: Atelectasis, Consolidation, Infiltration, Pneumothorax, Edema,
    # Emphysema, Fibrosis, Effusion, Pneumonia, Pleural_Thickening, Cardiomegaly,
    # Nodule, Mass, Hernia, Lung Lesion, Fracture, Lung Opacity, Enlarged Cardiomed.
    criticality: [0.4, 0.7, 0.5, 1.0, 0.9,
                  0.3, 0.3, 0.7, 0.8, 0.2,
                  0.4, 0.4, 0.6, 0.2, 0.6,
                  0.6, 0.5, 0.4]
  persona:
    name: solo_sdt_reader
    capability:
      kind: sdt
      sensitivity: 0.95
      specificity: 0.95
      prior: 0.1
      service_time_mu: 2.5
      service_time_sigma: 0.4
    sees_ai: false
  sort:
    kind: uncertainty_desc
    aggregator: mean

factors:
  patient_generator.arrival_rate: [0.04, 0.075, 0.15]
  sort.kind: [random, uncertainty_desc]

design: grid
replications: [1, 2, 3, 4, 5]

baseline:
  sort.kind: random

kpis: [system, actors]

by:
  - key: severity
    edges: [0.35, 0.75]     # bands: <0.35 (routine), 0.35-0.75 (urgent), >=0.75 (critical)

report:
  - system.throughput
  - system.mean_wait_to_doctor
  - system.mean_time_in_system
  - actors.doctor.recall_macro
  - actors.doctor.n_fn
