# MedGemma 27B (gen 1, FP8) over NIH ChestX-ray14 full, served by a vLLM pod on TAAI01.
#
# Builds data/cache/nih__medgemma-27b via the vLLM endpoint. Same image selection as
# v5_medgemma_nih_4b.yaml / nih_full_ensemble.yaml so all NIH cells align image-for-image.
#
# ⚠️ PRECISION: served in FP8 (W8A8, ~BF16 quality), NOT BF16 — see v5_medgemma_vindr_27b.yaml.
#    Document as "27B = FP8, 4B = BF16". Do not mix FP8/BF16 builds in this stem.
# ⚠️ 27B gen 1 vs 4B gen 1.5: not a scaling comparison. One model at a time (`./model.sh 27b`).
name: v5_medgemma_nih_27b
seed: 42
label_schema: xrv

patient_generator:
  kind: xrv_dataset
  dataset: nih
  imgpath: data/nih_full/images
  csvpath: data/nih_full/Data_Entry_2017.csv
  arrival_rate: 0.5
  n_patients: 200
  sample_mode: sequential
  views: [PA, AP]
  unique_patients: true
  resize: 896

ai:
  kind: medgemma
  backend: vllm
  model_id: google/medgemma-27b-it
  served_model_name: medgemma-27b
  endpoint: http://localhost:30827/v1
  readout: independent_question
  prompt_set: single
  uq: entropy
  decision_threshold: 0.5
  concurrency: 6
  top_logprobs: 20
  service_time: 30.0
  cache_mode: require

persona: senior_skeptical

sort:
  kind: uncertainty_desc
  aggregator: mean
