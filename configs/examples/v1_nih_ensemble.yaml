# Same as v1_nih_torchxrv but with a cross-domain Deep Ensemble for genuine
# epistemic uncertainty: five weight sets (NIH/CheXpert/MIMIC/PadChest/RSNA) vote
# per image, and their disagreement (mutual information) is the uncertainty
# signal the triage sorts on. Slower (5 forward passes/image) but the real UQ.

name: v1_nih_ensemble
seed: 42
label_schema: xrv

patient_generator:
  kind: xrv_dataset
  dataset: nih
  imgpath: data/nih_sample/images          # repo-relative; run hai-sim from the repo root
  csvpath: data/nih_sample/sample_labels.csv
  arrival_rate: 0.5
  n_patients: 200
  sample_mode: random

ai:
  kind: torchxrv
  weights:                       # cross-domain ensemble members
    - densenet121-res224-nih
    - densenet121-res224-chex
    - densenet121-res224-mimic_ch
    - densenet121-res224-pc
    - densenet121-res224-rsna
  uq: ensemble
  ensemble_measure: mutual_information   # epistemic disagreement
  decision_threshold: 0.5
  service_time: 0.25

doctor:
  kind: fixed_accuracy
  sensitivity: 0.85
  specificity: 0.90
  service_time_mu: 2.5
  service_time_sigma: 0.4

sort:
  kind: uncertainty_desc
  aggregator: mean

n_ai_workers: 1
n_doctor_workers: 1
