# A cross-domain Deep Ensemble for genuine epistemic uncertainty: four weight sets
# (CheXpert/MIMIC/PadChest/RSNA) vote per image, and their disagreement (mutual
# information) is the uncertainty signal the triage sorts on. The NIH-trained member is
# DROPPED on purpose — it is trained on this very NIH evaluation set, so it would leak
# in-domain (and, on our random sample, partly memorized) predictions. See thesis §6.2.
#
# Live inference is cacheable: build the per-member cells once on the GPU server
#   uv run python scripts/materialize_cache.py --scenario <this> --limit 0 --device cuda:0
# then set ai.cache_mode: require to replay them (data/cache/nih__<member>).

name: v1_nih_ensemble
seed: 42
label_schema: xrv

patient_generator:
  kind: xrv_dataset
  dataset: nih
  imgpath: data/nih_sample/images          # repo-relative; run hai-sim from the repo root
  csvpath: data/nih_sample/sample_labels.csv
  arrival_rate: 0.5
  n_patients: 200
  sample_mode: random
  views: [PA, AP]          # include AP (portable/ICU) frontals, not just PA
  unique_patients: true    # one image per patient → independent samples

ai:
  kind: torchxrv
  weights:                       # 4-member cross-domain ensemble (NIH member dropped: leakage)
    - densenet121-res224-chex
    - densenet121-res224-mimic_ch
    - densenet121-res224-pc
    - densenet121-res224-rsna
  uq: ensemble
  ensemble_measure: mutual_information   # epistemic disagreement
  decision_threshold: 0.5
  service_time: 0.25
  # "off" = live ensemble (a quick smoke). Build caches with materialize_cache.py, then set
  # "require" to replay data/cache/nih__<member>, or "fill" to build gaps on the GPU server.
  cache_mode: "off"

persona:                   # fixed-accuracy solo reader
  capability:
    kind: fixed_accuracy
    sensitivity: 0.85
    specificity: 0.90
  sees_ai: false

sort:
  kind: uncertainty_desc
  aggregator: mean

n_ai_workers: 1
n_doctor_workers: 1
