# Persona grid on real NIH predictions, with SDT readers and per-pathology KPIs.
#
#   hai-sim study configs/examples/study_nih_persona_sdt.yaml
#
# Successor to old/study_nih_persona_contrast.yaml, with two fixes:
#   1. The AI replays the composed 4-member cache-matrix cells
#      (data/cache/composed/nih__ens4) instead of the retired nih_ensemble stem.
#   2. Readers are the library personas, which are SDT observers (they used to be
#      FixedAccuracyDoctor). A fixed-accuracy reader's
#      confidence is a two-valued constant, so a linear pool flips a label only past a
#      fixed margin — the Δ = 0.0000 artifact measured on the senior arms during
#      development (thesis §5.7). The SDT belief varies per case, so trust becomes a curve.
#
# `by: label` computes every KPI per pathology: the macro numbers hide that AI help is
# concentrated where the reader's d' meets a pathology the ensemble ranks well.
name: nih_persona_sdt

base:
  name: base
  seed: 0
  label_schema: xrv
  patient_generator:
    kind: inference_cache
    cache_stem: data/cache/composed/nih__ens4
    arrival_rate: 0.5
    n_patients: 1000
    sample_mode: random
    split: odd                          # calibration below was fitted on the even rows
  ai:
    kind: cached
    cache_stem: data/cache/composed/nih__ens4
    uq: ensemble
    ensemble_measure: mean_entropy
    decision_threshold: 0.5
    service_time: 0.25
    calibration:                        # per-pathology Platt on the fused probability,
      kind: platt                       # written by scripts/fit_calibration.py
      path: data/cache/calibration/nih__ens4.json
  persona: solo_senior
  fusion:                              # the rule; the persona keeps its own weight
    kind: linear_pool
    beta: 0.0
  sort:
    kind: uncertainty_desc
    aggregator: mean

factors:
  ai.calibration.kind: [identity, platt]   # raw vs calibrated advice, same readers
  fusion.kind: [linear_pool, log_odds_fusion]   # average probabilities vs add evidence
  persona:          # names from the persona library (src/hai_sim/personas.py)
    - solo_senior
    - senior_skeptical
    - senior_trusting
    - junior_skeptical
    - junior_trusting

design: grid
replications: [1, 2, 3, 4, 5]

baseline:
  persona: solo_senior

kpis: [system, actors, team]

by:
  - key: label

report:
  - actors.doctor.recall_macro
  - actors.hybrid.recall_macro
  - actors.hybrid.f1_macro
  - actors.hybrid.n_fn
  - actors.hybrid.n_fp
  - team.complementarity_gap_f1
  - team.rair
  - team.rsr
  - team.over_reliance
  - team.under_reliance
