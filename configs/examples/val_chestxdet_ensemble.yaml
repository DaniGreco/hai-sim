# Localization + label validation of the cross-domain Deep Ensemble against
# ChestX-Det expert ground truth. The Grad-CAM is averaged over the members that
# cover each pathology, so the heatmap reflects the same ensemble whose
# uncertainty the simulator's triage sorts on. Slower (5 backward passes/finding).
#
# Prereq: uv run python scripts/download_chestxdet.py   (test split, ~212 MB)
# Run (Windows: set PYTHONUTF8=1 first, from the repo root):
#   uv run python -m hai_sim.cli validate configs/examples/val_chestxdet_ensemble.yaml

name: val_chestxdet_ensemble
seed: 0
label_schema: xrv

dataset:
  kind: chestxdet
  annotation_path: data/chestxdet/ChestX_Det_test.json
  image_dir: data/chestxdet/test
  resize: 224

ai:
  kind: torchxrv
  weights:                       # cross-domain ensemble members
    - densenet121-res224-nih
    - densenet121-res224-chex
    - densenet121-res224-mimic_ch
    - densenet121-res224-pc
    - densenet121-res224-rsna
  uq: ensemble
  ensemble_measure: predictive_entropy
  decision_threshold: 0.5

saliency: grad_cam

metrics:
  pointing_game: true
  pointing_tolerance: 16   # ~half a 7x7 CAM cell on a 224 image (0 = strict exact pixel)
  energy_in_mask: true
  iou_thresholds: [0.5]
  dice_thresholds: [0.5]

limit: 0   # 0 = all test images
