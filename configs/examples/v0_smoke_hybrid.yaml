# Hybrid mode: doctor copies AI's label on the per-label dimensions where the
# AI is "certain" (uncertainty < 0.3), and decides on its own elsewhere.
# Compare KPI of this scenario against v0_smoke_uncertainty.yaml (same seed,
# same sort, only `use_ai_hint` + `assisted_policy` differ).
name: v0_smoke_hybrid
seed: 42
label_schema: default_v0

patient_generator:
  kind: poisson
  arrival_rate: 0.5
  n_patients: 100
  prevalence: 0.2
  image_shape: [1, 1]

ai:
  kind: random_mock
  service_time: 0.05
  alpha_conf: 2.0
  beta_conf: 2.0
  alpha_unc: 2.0
  beta_unc: 5.0

doctor:
  kind: random_mock
  service_time_mu: 2.5
  service_time_sigma: 0.4
  alpha_conf: 5.0
  beta_conf: 2.0
  alpha_unc: 2.0
  beta_unc: 5.0
  use_ai_hint: true
  assisted_policy: follow_when_certain
  ai_hint_uncertainty_threshold: 0.3

sort:
  kind: uncertainty_desc
  aggregator: mean

n_ai_workers: 1
n_doctor_workers: 1
