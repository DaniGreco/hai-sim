# MedGemma 27B (gen 1, FP8) over VinDr-CXR, served by a vLLM pod on TAAI01.
#
# Builds data/cache/vindr__medgemma-27b via the vLLM endpoint.
#
# ⚠️ PRECISION: this 27B is served in FP8 (W8A8 dynamic, native Blackwell, ~BF16 quality),
# NOT BF16 — the only way to fit it in the ~37.5 GB free on the shared GPU1 (BF16 needs a
# whole free 96 GB card, and both are held by production). Document as "27B = FP8, 4B = BF16".
# A clean BF16 27B would need a dedicated free-GPU window — Daniele's call. The cache
# identity does NOT encode precision, so do not mix an FP8 and a BF16 build in this stem.
#
# ⚠️ 27B is gen 1, 4B is gen 1.5 — size AND generation differ; not a scaling comparison.
# ⚠️ Prereq: pod `thesis-medgemma-27b` Ready (`./model.sh 27b` scales 4B->0, 27B->1; needs
#    the nvidia-persistenced socket, see v5_medgemma_vindr_4b.yaml). One model at a time.
name: v5_medgemma_vindr_27b
seed: 42
label_schema: xrv

patient_generator:
  kind: image_folder
  dataset_id: vindr
  imgpath: data/vindr/images
  image_ext: .png
  arrival_rate: 0.5
  n_patients: 200
  resize: 896
  gt_source: native
  label_sources:
    - name: majority
      kind: csv
      path: data/vindr/labels.csv
      id_column: image_id
      space: vindr
      map: vindr14->xrv

label_view:
  mode: subset
  targets:
    - Cardiomegaly
    - Effusion
    - Consolidation
    - Atelectasis
    - Infiltration
    - Nodule
    - Mass
    - Pleural_Thickening
    - Pneumothorax
    - Fibrosis
    - Lung Opacity

ai:
  kind: medgemma
  backend: vllm
  model_id: google/medgemma-27b-it      # identity + cache alias (-> medgemma-27b)
  served_model_name: medgemma-27b
  endpoint: http://localhost:30827/v1    # NodePort -> thesis-medgemma-27b (FP8)
  readout: independent_question
  prompt_set: single
  uq: entropy
  decision_threshold: 0.5
  concurrency: 6                         # <= vLLM --max-num-seqs (8) on the 27B pod
  top_logprobs: 20
  service_time: 30.0
  cache_mode: require

difficulty:
  kind: table
  path: data/vindr/difficulty.csv
  value_column: mean_delta_active

persona: senior_skeptical

sort:
  kind: uncertainty_desc
  aggregator: mean
