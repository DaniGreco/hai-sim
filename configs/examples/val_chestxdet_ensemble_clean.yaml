# Leakage-free variant of val_chestxdet_ensemble: the cross-domain ensemble WITHOUT
# the NIH member. ChestX-Det images come from NIH ChestX-ray14, and
# densenet121-res224-nih was trained on NIH, so it may have seen these exact images
# (their file numbering is ChestX-Det-internal, so the overlap is not verifiable).
# The four remaining members were trained on CheXpert / MIMIC / PadChest / RSNA —
# none of them NIH — so every image here is genuine held-out data for them, and
# PadChest still covers the NIH-specific labels (Emphysema/Fibrosis/Nodule/Mass/...).
# Use this as the clean primary; compare against the 5-member run to see how much
# the NIH member helps (and how much of that is memorization).
#
# Run (Windows: PYTHONUTF8=1, from repo root):
#   uv run python -m hai_sim.cli validate configs/examples/val_chestxdet_ensemble_clean.yaml

name: val_chestxdet_ensemble_clean
seed: 0
label_schema: xrv

dataset:
  kind: chestxdet
  annotation_path: data/chestxdet/ChestX_Det_test.json
  image_dir: data/chestxdet/test
  resize: 224

ai:
  kind: torchxrv
  weights:                       # cross-domain members, NIH deliberately excluded
    - densenet121-res224-chex
    - densenet121-res224-mimic_ch
    - densenet121-res224-pc
    - densenet121-res224-rsna
  uq: ensemble
  ensemble_measure: predictive_entropy
  decision_threshold: 0.5

saliency: grad_cam

metrics:
  pointing_game: true
  pointing_tolerance: 16
  energy_in_mask: true
  iou_thresholds: [0.5]
  dice_thresholds: [0.5]

limit: 0
