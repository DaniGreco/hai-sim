# Real NIH study (RQ3) via cache replay — the doctor-persona sweep on the actual 5-member
# cross-domain ensemble's predictions, WITHOUT re-running inference. Reads the prebuilt cache
# (data/cache/nih_ensemble, 4230 images), so the whole 30-run study finishes in seconds.
# Run:  hai-sim study configs/examples/study_nih_persona_grid.yaml
# (needs data/cache/nih_ensemble.{npz,json} — build once via scripts/build_inference_cache.py)

name: nih_persona_grid
base:
  name: base
  seed: 0
  label_schema: xrv
  patient_generator:
    kind: inference_cache
    cache_stem: data/cache/nih_ensemble
    arrival_rate: 0.5
    n_patients: 1000
    sample_mode: sequential
  ai:
    kind: cached
    cache_stem: data/cache/nih_ensemble
    uq: ensemble
    ensemble_measure: predictive_entropy   # the strong failure-prediction measure (RQ1 finding)
    decision_threshold: 0.5
  persona: solo_senior
  sort:
    kind: uncertainty_desc
    aggregator: mean

factors:
  persona: [solo_senior, senior_trusting, senior_skeptical, junior_trusting, junior_skeptical]
  sort.aggregator: [mean, max]

design: grid
replications: [1, 2, 3]

report:
  - team.complementarity_gap_f1
  - team.rair
  - team.rsr
  - actors.ai.recall_macro
  - actors.doctor.recall_macro
  - actors.hybrid.recall_macro
  - actors.hybrid.n_fn
