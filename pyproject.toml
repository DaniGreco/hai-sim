[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hai_sim"
version = "0.0.1"
description = "Human-AI diagnostic workflow simulator (thesis: Daniele Greco, UniBg)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniele Greco" }]
dependencies = [
    "simpy>=4.1.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]
# Real pre-trained CXR inference stack. Heavy (~hundreds of MB on CPU).
# Install CPU-only torch to keep it light:
#   uv pip install -e ".[models]" --extra-index-url https://download.pytorch.org/whl/cpu
models = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchxrayvision>=1.2",
    "scikit-image>=0.22",
    "kagglehub>=0.3",
    # MedGemma (generative vision-language reader). 4.50 is the floor its model card
    # states; the weights themselves are gated and must be accepted on Hugging Face.
    "transformers>=4.50",
    "accelerate>=0.30",
    "pillow>=10.0",
]
# Offline analysis / plotting (inference cache → error-capture curves).
analysis = [
    "matplotlib>=3.8",
]
# The result browser: `hai-sim ui`. Reads what is already on disk; runs nothing.
# Streamlit pulls pandas, which is why it is an extra and not a core dependency —
# the simulator itself must stay installable without it.
ui = [
    "streamlit>=1.40",
]

[project.scripts]
hai-sim = "hai_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    # torchxrayvision ships weights pickled with an older torch; the loader emits
    # benign SourceChangeWarning. Silence to keep test output clean. `Warning` is
    # the builtin base category, so this needs no torch import when the extra is absent.
    "ignore::Warning:torch.serialization",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
# The Streamlit page is a view: two untyped third-party imports and no logic worth
# checking. Everything it does that could be wrong lives in `ui/results.py`, which is
# checked, has no Streamlit import, and is covered by the normal test suite.
exclude = "src/hai_sim/ui/app.py"

# Third-party libraries without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = [
    "yaml",
    "torch.*",
    "torchvision.*",
    "torchxrayvision.*",
    "transformers.*",
    "skimage.*",
    "kagglehub.*",
    "matplotlib.*",
]
ignore_missing_imports = true
