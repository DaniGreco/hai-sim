[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hai_sim"
version = "0.0.1"
description = "Human-AI diagnostic workflow simulator (thesis: Daniele Greco, UniBg)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniele Greco" }]
dependencies = [
    "simpy>=4.1.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]
# Real pre-trained CXR inference stack. Heavy (~hundreds of MB on CPU).
# Install CPU-only torch to keep it light:
#   uv pip install -e ".[models]" --extra-index-url https://download.pytorch.org/whl/cpu
models = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchxrayvision>=1.2",
    "scikit-image>=0.22",
    "kagglehub>=0.3",
]
# Offline analysis / plotting (inference cache → error-capture curves).
analysis = [
    "matplotlib>=3.8",
]

[project.scripts]
hai-sim = "hai_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    # torchxrayvision ships weights pickled with an older torch; the loader emits
    # benign SourceChangeWarning. Silence to keep test output clean. `Warning` is
    # the builtin base category, so this needs no torch import when the extra is absent.
    "ignore::Warning:torch.serialization",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# Third-party libraries without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = [
    "yaml",
    "torch.*",
    "torchvision.*",
    "torchxrayvision.*",
    "transformers.*",
    "skimage.*",
    "kagglehub.*",
    "matplotlib.*",
]
ignore_missing_imports = true
